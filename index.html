<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재운세 - 무료 AI 테스트</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; max-width: 500px; margin: 40px auto; padding: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; background-color: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        #result { white-space: pre-wrap; line-height: 1.6; background-color: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🔮 현재운세 (무료 AI)</h2>
        <label>요즘 가장 큰 고민/관심사</label>
        <input type="text" id="concern" placeholder="예: 이직, 주식, 연애">

        <label>상세 내용</label>
        <textarea id="detail" rows="3" placeholder="상황을 간단히 적어주세요"></textarea>

        <button onclick="getFortune()">운세 보기</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h3>✨ AI 운세 분석</h3>
        <div id="result">분석 중...</div>
    </div>

    <script>
        // 운세 가져오기 함수
        async function getFortune() {
            const concern = document.getElementById('concern').value; // 입력한 고민 값 (ID는 실제 HTML에 맞춰 확인 필요)
            const detail = document.getElementById('detail').value;   // 입력한 상세 내용 값
            const resultDiv = document.getElementById('result');      // 결과를 보여줄 영역

            if (!concern) {
                alert("고민을 입력해주세요!");
                return;
            }

            document.getElementById('resultCard').style.display = 'block';
            resultDiv.innerHTML = "AI 명리학자가 운세를 분석 중입니다... 잠시만 기다려주세요 🔮";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ concern, detail })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = `<div class="fortune-result">${data.fortune}</div>`;
                } else {
                    resultDiv.innerHTML = `에러 발생: ${data.error || '알 수 없는 오류'}`;
                }
            } catch (err) {
                resultDiv.innerHTML = `통신 에러 발생: ${err.message}`;
            }
        }
    </script>
</body>
</html>
