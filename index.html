<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 운세 서비스</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; text-align: center; }
        input, textarea, button { width: 100%; margin-top: 10px; padding: 10px; box-sizing: border-box; }
        button { background: #4F46E5; color: white; border: none; font-weight: bold; cursor: pointer; }
        #result { margin-top: 20px; padding: 15px; background: #f3f4f6; border-radius: 8px; white-space: pre-line; }
    </style>
</head>
<body>
    <h2>🔮 AI 무료 운세 보기</h2>
    <input type="text" id="concern" placeholder="고민을 입력하세요 (예: 올해 연애운)">
    <textarea id="detail" placeholder="상세 내용을 입력하세요 (선택)"></textarea>
    <button onclick="getFortune()">운세 보기</button>

    <div id="result"></div>

    <script>
        // 백엔드 Worker 주소
        const WORKER_URL = 'https://202610testing.iamleeka12.workers.dev';

        async function getFortune() {
            const concern = document.getElementById('concern').value;
            const detail = document.getElementById('detail').value;
            const resultDiv = document.getElementById('result');

            if (!concern) {
                alert("고민을 입력해주세요!");
                return;
            }

            resultDiv.innerHTML = "AI 명리학자가 운세를 분석 중입니다... 🔮";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ concern, detail })
                });

                const data = await response.json();
                
                if (response.ok) {
                    resultDiv.innerHTML = data.fortune;
                } else {
                    resultDiv.innerHTML = "오류 발생: " + (data.error || "알 수 없는 오류");
                }
            } catch (err) {
                resultDiv.innerHTML = "통신 에러: " + err.message;
            }
        }
    </script>
</body>
</html>
