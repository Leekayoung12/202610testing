<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>현재운세 - 무료 AI 테스트</title>
    <style>
        body { font-family: sans-serif; background-color: #0f172a; color: white; max-width: 500px; margin: 40px auto; padding: 20px; }
        .card { background-color: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0 16px 0; background-color: #0f172a; color: white; border: 1px solid #334155; border-radius: 6px; box-sizing: border-radius; }
        button { width: 100%; padding: 12px; background-color: #38bdf8; color: #0f172a; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; }
        #result { white-space: pre-wrap; line-height: 1.6; background-color: #0f172a; padding: 15px; border-radius: 6px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="card">
        <h2>현재운세 (무료 AI)</h2>
        <label>요즘 가장 큰 고민/관심사</label>
        <input type="text" id="concern" placeholder="예: 이직, 주식, 연애">

        <label>상세 내용</label>
        <textarea id="detail" rows="3" placeholder="상황을 간단히 적어주세요"></textarea>

        <button type="button" id="fortuneBtn">운세 보기</button>
    </div>

    <div class="card" id="resultCard" style="display:none;">
        <h3>AI 운세 분석</h3>
        <div id="result">분석 중...</div>
    </div>

    <script>
        const WORKER_URL = window.location.hostname.endsWith("workers.dev")
            ? "/api/fortune"
            : "https://202610testing.iamleeka12.workers.dev/api/fortune";

        async function getFortune() {
            const concern = document.getElementById("concern").value;
            const detail = document.getElementById("detail").value;
            const resultDiv = document.getElementById("result");

            if (!concern) {
                alert("고민을 입력해주세요!");
                return;
            }

            document.getElementById("resultCard").style.display = "block";
            resultDiv.textContent = "AI 명리학자가 운세를 분석 중입니다... 잠시만 기다려주세요";

            try {
                const response = await fetch(WORKER_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ concern, detail })
                });

                const raw = await response.text();
                let data = {};
                try {
                    data = JSON.parse(raw);
                } catch {
                    throw new Error("서버가 운세 API가 아니라 웹페이지를 반환했습니다. Worker POST 핸들러를 확인하세요.");
                }

                if (response.ok && data.fortune) {
                    resultDiv.textContent = data.fortune;
                } else {
                    resultDiv.textContent = "에러 발생: " + (data.error || ("HTTP " + response.status));
                }
            } catch (err) {
                resultDiv.textContent = "통신 에러 발생: " + err.message;
            }
        }

        document.getElementById("fortuneBtn").addEventListener("click", getFortune);
    </script>
</body>
</html>
